<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 24">
  <defs>
    <linearGradient id="dg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#07060b"/>
      <stop offset="22%" stop-color="#00e5ff"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="78%" stop-color="#ff2e4c"/>
      <stop offset="100%" stop-color="#07060b"/>
    </linearGradient>
  </defs>
  <rect x="0" y="10" width="1200" height="3" rx="1.5" fill="url(#dg)"/>
  <!-- Gojo orb sweeps right -->
  <circle cy="11.5" r="4" fill="#00e5ff">
    <animate attributeName="cx" values="0;600" dur="2.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="2.6s" repeatCount="indefinite"/>
  </circle>
  <!-- Sukuna orb sweeps left -->
  <circle cy="11.5" r="4" fill="#ff2e4c">
    <animate attributeName="cx" values="1200;600" dur="2.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="2.6s" repeatCount="indefinite"/>
  </circle>
  <!-- clash flash at center -->
  <circle cx="600" cy="11.5" r="0" fill="#a855f7">
    <animate attributeName="r" values="0;7;0" dur="2.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.9;0" dur="2.6s" repeatCount="indefinite"/>
  </circle>
</svg>
