<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" font-family="'Segoe UI', 'Yu Gothic', monospace">
  <defs>
    <radialGradient id="glowL" cx="50%" cy="55%" r="60%">
      <stop offset="0%" stop-color="#1e90ff" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#0a2a5e" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#07060b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="50%" cy="55%" r="60%">
      <stop offset="0%" stop-color="#e01e37" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#7a0b1e" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#07060b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ff2e4c"/>
      <animate attributeName="x1" values="0%;100%;0%" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="100%;200%;100%" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur6"><feGaussianBlur stdDeviation="6"/></filter>
    <style>
      .glitch-r { animation: gr 3.1s infinite steps(1); }
      .glitch-c { animation: gc 2.7s infinite steps(1); }
      @keyframes gr {
        0%, 93%  { transform: translate(0,0); opacity: 0; }
        94%      { transform: translate(4px,-2px); opacity: .85; }
        96%      { transform: translate(-5px,2px); opacity: .85; }
        98%      { transform: translate(3px,1px); opacity: .85; }
        99%      { transform: translate(0,0); opacity: 0; }
      }
      @keyframes gc {
        0%, 90%  { transform: translate(0,0); opacity: 0; }
        91%      { transform: translate(-4px,2px); opacity: .8; }
        94%      { transform: translate(5px,-1px); opacity: .8; }
        96%      { transform: translate(-3px,-2px); opacity: .8; }
        97%      { transform: translate(0,0); opacity: 0; }
      }
      .flicker { animation: fl 7s infinite; }
      @keyframes fl {
        0%, 41%, 43%, 78%, 80%, 100% { opacity: 1; }
        42%, 79% { opacity: .35; }
      }
      .dash { stroke-dasharray: 14 10; animation: dashmove 1.2s linear infinite; }
      @keyframes dashmove { to { stroke-dashoffset: -24; } }
      .kanji { animation: kpulse 4s ease-in-out infinite; }
      @keyframes kpulse { 0%,100% { opacity: .5; } 50% { opacity: 1; } }
      .cursor { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>

  <!-- background -->
  <rect width="1200" height="340" fill="#07060b"/>
  <g stroke-width="1">
    <g stroke="#0d1a2a">
      <path d="M0 60H600M0 120H600M0 180H600M0 240H600M0 300H600"/>
      <path d="M100 0V340M240 0V340M380 0V340M520 0V340"/>
    </g>
    <g stroke="#2a0d14">
      <path d="M600 60H1200M600 120H1200M600 180H1200M600 240H1200M600 300H1200"/>
      <path d="M680 0V340M820 0V340M960 0V340M1100 0V340"/>
    </g>
  </g>
  <!-- dual glow: Gojo left / Sukuna right -->
  <rect x="0" y="0" width="620" height="340" fill="url(#glowL)">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="4s" repeatCount="indefinite"/>
  </rect>
  <rect x="580" y="0" width="620" height="340" fill="url(#glowR)">
    <animate attributeName="opacity" values="1;0.7;1" dur="4s" repeatCount="indefinite"/>
  </rect>
  <!-- clash seam -->
  <rect x="598" y="0" width="4" height="340" fill="#a855f7" opacity="0.5" filter="url(#blur6)">
    <animate attributeName="opacity" values="0.25;0.75;0.25" dur="2.2s" repeatCount="indefinite"/>
  </rect>

  <!-- cursed energy particles -->
  <g>
    <circle cx="150" cy="290" r="2.5" fill="#00e5ff" opacity="0.8">
      <animate attributeName="cy" values="290;40" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.9;0" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="330" cy="320" r="2.2" fill="#a855f7" opacity="0.7">
      <animate attributeName="cy" values="320;50" dur="8s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.7;0" dur="8s" begin="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1050" cy="310" r="2" fill="#ff2e4c">
      <animate attributeName="cy" values="310;30" dur="9s" begin="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.8;0" dur="9s" begin="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="880" cy="300" r="1.8" fill="#ffb627">
      <animate attributeName="cy" values="300;60" dur="6s" begin="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.9;0" dur="6s" begin="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- kanji: Gojo (left) vs Sukuna (right) -->
  <text x="60" y="105" font-size="58" fill="#2563eb" class="kanji" font-weight="700" opacity="0.65">無量空処</text>
  <text x="1140" y="105" font-size="58" fill="#c81030" text-anchor="end" class="kanji" font-weight="700" opacity="0.65">伏魔御廚子</text>
  <text x="600" y="316" font-size="24" fill="#6b4a9e" text-anchor="middle" class="kanji" font-weight="700">呪力 // CURSED ENERGY</text>

  <!-- glitch title -->
  <g font-size="88" font-weight="800" letter-spacing="4" text-anchor="middle" font-family="'Consolas','Courier New',monospace">
    <text x="600" y="205" fill="#00e5ff" class="glitch-r" opacity="0">ARCHNEXUS707</text>
    <text x="600" y="205" fill="#ff2e4c" class="glitch-c" opacity="0">ARCHNEXUS707</text>
    <text x="600" y="205" fill="url(#neon)" filter="url(#blur6)" opacity="0.6">ARCHNEXUS707</text>
    <text x="600" y="205" fill="url(#neon)" class="flicker">ARCHNEXUS707</text>
  </g>

  <!-- subtitle -->
  <g font-family="'Consolas','Courier New',monospace" text-anchor="middle">
    <text x="600" y="252" font-size="21" fill="#e6def2" letter-spacing="6">PURPLE TEAM OPERATOR // ADVERSARY EMULATION</text>
    <text x="600" y="288" font-size="16" fill="#8a6ab0" letter-spacing="3">&gt; domain_expansion --unlimited-exploits<tspan class="cursor" fill="#a855f7">▊</tspan></text>
  </g>

  <!-- HUD frame: cyan left, red right -->
  <g fill="none" stroke-width="2">
    <path d="M30 55V30H120" stroke="#00e5ff" class="dash"/>
    <path d="M30 285V310H120" stroke="#00e5ff" class="dash"/>
    <path d="M1170 55V30H1080" stroke="#ff2e4c" class="dash"/>
    <path d="M1170 285V310H1080" stroke="#ff2e4c" class="dash"/>
  </g>

  <!-- moving scanline -->
  <rect x="0" y="-80" width="1200" height="80" fill="url(#scan)">
    <animate attributeName="y" values="-80;340" dur="3.5s" repeatCount="indefinite"/>
  </rect>
</svg>
